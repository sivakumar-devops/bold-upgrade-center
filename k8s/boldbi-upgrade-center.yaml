apiVersion: v1
kind: ServiceAccount
metadata:
  name: boldbi-upgrade-center
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boldbi-upgrade-center
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boldbi-upgrade-center
subjects:
  - kind: ServiceAccount
    name: boldbi-upgrade-center
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boldbi-upgrade-center
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boldbi-upgrade-center-config
data:
  releaseVersionsApiUrl: "https://boldbi-release-api.boldbidemo.com/version/json"
  idpApi: "http://id-api-service:6001/api"
  ums: "http://id-ums-service:6002/ums"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boldbi-upgrade-center
  labels:
    app.kubernetes.io/name: boldbi-upgrade-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boldbi-upgrade-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boldbi-upgrade-center
    spec:
      serviceAccountName: boldbi-upgrade-center
      automountServiceAccountToken: true
      containers:
        - name: boldbi-upgrade-center
          image: sivakumar2809/upgrade-center-ui:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: UpgradeCenter__ReleaseVersionsApiUrl
              valueFrom:
                configMapKeyRef:
                  name: boldbi-upgrade-center-config
                  key: releaseVersionsApiUrl
            - name: UpgradeCenter__Services__IdpApi
              valueFrom:
                configMapKeyRef:
                  name: boldbi-upgrade-center-config
                  key: idpApi
            - name: UpgradeCenter__Services__Ums
              valueFrom:
                configMapKeyRef:
                  name: boldbi-upgrade-center-config
                  key: ums
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /upgrade-center/health-check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /upgrade-center/health-check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: boldbi-upgrade-center
  labels:
    app.kubernetes.io/name: boldbi-upgrade-center
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: boldbi-upgrade-center
  ports:
    - name: http
      port: 80
      targetPort: http
